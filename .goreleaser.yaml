# GoReleaser config for NexTalk.
#
# Builds the `nextalk` CLI for every supported OS/arch, packages each as a
# .tar.gz (.zip on Windows), generates checksums, and writes a changelog
# from Conventional-Commit-style commit messages. The WASM assets are built
# by .github/workflows/release.yml before GoReleaser starts. release.extra_files
# attaches those prebuilt files to the same draft GitHub Release as the CLI.
#
# Local test run (no publish): goreleaser release --snapshot --clean
version: 2
project_name: nextalk
before:
  hooks:
    - go mod tidy
builds:
  - id: nextalk
    main: ./cmd/nextalk
    binary: nextalk
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/erfanheydarzade/NexTalk/internal/buildinfo.Version={{.Version}}
      - -X github.com/erfanheydarzade/NexTalk/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/erfanheydarzade/NexTalk/internal/buildinfo.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      # darwin/arm and windows/arm are not meaningful targets.
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
archives:
  - id: nextalk-archive
    ids: [nextalk]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - docs/**
      - .env.example

  # Raw, unpacked binary for people who'd rather download-and-run than
  # download-extract-move. Same naming scheme as the archive above; the
  # native binary extension (.exe on Windows) is appended automatically.
  # Uploaded as extra assets alongside the .tar.gz/.zip.
  # Note: GoReleaser's `binary` format ships the single executable only —
  # it has no `files:` option — so .env.example can't ride along here.
  # It's bundled in the .tar.gz/.zip archive above instead; anyone who
  # grabs the raw binary can still get it from the repo or that archive.
  - id: nextalk-binary
    ids: [nextalk]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    formats: [binary]
checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: ./dist-release/nextalk-wasm_{{ .Tag }}.tar.gz
    - glob: ./dist-release/nextalk_{{ .Tag }}.wasm
    - glob: ./dist-release/wasm_exec_{{ .Tag }}.js
    - glob: ./dist-release/nextalk-wasm_{{ .Tag }}.version.json
changelog:
  # A concise, human-clean release body instead of the raw commit log:
  # grouped by type, with merge commits and CI noise filtered out.
  sort: asc
  use: github
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"
      - "^ci:"
      - "^chore\\(deps\\):"
  groups:
    - title: "Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "Documentation"
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: "Other"
      order: 999
release:
  # Keep the release as a draft while GoReleaser uploads the complete asset
  # set. The workflow publishes it only after GoReleaser succeeds.
  draft: true
  replace_existing_draft: true
  preflight:
    fail_on_error: true

  name_template: "NexTalk {{ .Version }}"
  header: |
    ## NexTalk {{ .Version }}
    Prebuilt binaries for Linux, macOS and Windows are below, plus a
    browser/WebAssembly build, assembled into this same release before
    publication: the full bundle (`nextalk-wasm_{{ .Tag }}.tar.gz`) and the
    loose `nextalk_{{ .Tag }}.wasm` + `wasm_exec_{{ .Tag }}.js` (plus the
    `nextalk-wasm_{{ .Tag }}.version.json` manifest). See
    [`docs/wasm.md`](https://github.com/erfanheydarzade/NexTalk/blob/{{ .Tag }}/docs/wasm.md)
    for how to run the WASM build, and
    [`docs/adding-a-transport.md`](https://github.com/erfanheydarzade/NexTalk/blob/{{ .Tag }}/docs/adding-a-transport.md)
    to add a new transport backend.
  footer: |
    **Full Changelog**: https://github.com/erfanheydarzade/NexTalk/compare/{{ .PreviousTag }}...{{ .Tag }}
  extra_files:
    - glob: ./dist-release/nextalk-wasm_{{ .Tag }}.tar.gz
    - glob: ./dist-release/nextalk_{{ .Tag }}.wasm
    - glob: ./dist-release/wasm_exec_{{ .Tag }}.js
    - glob: ./dist-release/nextalk-wasm_{{ .Tag }}.version.json