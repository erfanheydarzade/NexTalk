name: Release

# Push a button instead of tagging-and-waiting: run this from the Actions
# tab (Run workflow) and choose a version. It tags that version, builds
# nextalk for every supported OS/arch as .tar.gz/.zip archives, builds the
# WASM bundle, and publishes everything as one GitHub Release with an
# auto-generated changelog.
#
# Re-running this workflow is safe only while its release is still a draft.
# Once GitHub publishes the release, immutability freezes the tag and assets.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release, e.g. v1.4.0 (must start with "v" and follow
          semver). Leave the "prerelease" box checked for a beta/rc build.
        required: true
        type: string
      prerelease:
        description: "Mark this as a pre-release (not shown as 'latest')"
        required: false
        type: boolean
        default: false
  # Also supports the traditional `git tag vX.Y.Z && git push --tags` flow
  # for anyone who prefers that over the manual button.
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  tag:
    name: Tag release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Validate version input
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}   # via env: never interpolate inputs into the script
        run: |
          version="$INPUT_VERSION"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a valid semver tag (expected e.g. v1.4.0 or v1.4.0-rc.1)"
            exit 1
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag (no-op if it already exists)
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tag="$TAG"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, reusing it."
          else
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi

  release:
    name: Build & publish
    needs: [tag]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # --- Browser/WASM bundle and loose assets ---
      # Build these files before GoReleaser so it can attach them to the
      # same draft release as the CLI archives.
      - name: Build WASM bundle
        run: |
          set -euo pipefail
          rm -rf dist-wasm dist-release
          mkdir -p dist-release
          NEXTALK_VERSION="${RELEASE_TAG}" bash ./cmd/nextalk-wasm/build.sh dist-wasm/web/wasm
          cp web/index.html web/nextalk-messenger.html dist-wasm/web/
          cp web/wasm/ntx-host.js dist-wasm/web/wasm/ntx-host.js
          node web/tools/seal-csp.mjs --check
          cp README.md LICENSE dist-wasm/
          cp -r docs dist-wasm/docs
          cat > dist-wasm/README-WASM.txt <<'EOF'
          NexTalk WebAssembly bundle
          ===========================
          web/index.html        two-tab browser demo, talks to itself over
                                 the worker relay (see docs/wasm.md)
          web/wasm/nextalk.wasm the compiled Go/wasm module
          web/wasm/wasm_exec.js the matching Go JS glue (do not mix versions
                                 from a different Go release)

          This must be served over HTTP, not opened as a file:// URL —
          browsers block WebAssembly's streaming instantiation and ES module
          fetches under file://. From this bundle's root:

              python3 -m http.server 8000

          then open http://localhost:8000/web/ — see docs/wasm.md for
          details and the full JS API.
          EOF
          tar -C dist-wasm -czf "dist-release/nextalk-wasm_${RELEASE_TAG}.tar.gz" .

      # --- WebAssembly relay extensions (.ntx), built reproducibly with Node ---
      - name: Build WASM extensions
        run: |
          set -euo pipefail
          (cd example-transports && node build-all.mjs --wasm-only)
          cp example-transports/dist/relay-example-wasm.ntx "dist-release/relay-example-wasm_${RELEASE_TAG}.ntx"
          cp web/nextalk-messenger.html "dist-release/nextalk-messenger_${RELEASE_TAG}.html"

      # --- Loose WASM assets: for people who just want to grab the two
      # files and drop them in their own web app, with no tar/extract step
      # and no automation. Named with the version + a real extension so
      # they're unambiguous sitting next to the CLI archives on the
      # release page. Content is byte-identical to what's inside the
      # tarball above; this is purely an additional, unpacked copy.
      - name: Stage loose WASM assets
        run: |
          set -euo pipefail
          cp dist-wasm/web/wasm/nextalk.wasm "dist-release/nextalk_${RELEASE_TAG}.wasm"
          cp dist-wasm/web/wasm/wasm_exec.js "dist-release/wasm_exec_${RELEASE_TAG}.js"
          printf '{\n  "version": "%s",\n  "api": "3",\n  "files": {\n    "wasm": "nextalk_%s.wasm",\n    "glue": "wasm_exec_%s.js"\n  }\n}\n' \
            "${RELEASE_TAG}" "${RELEASE_TAG}" "${RELEASE_TAG}" > "dist-release/nextalk-wasm_${RELEASE_TAG}.version.json"

      # --- CLI + WASM assets -> one complete draft GitHub Release ---
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}

      # No assets are uploaded after GoReleaser. This only publishes the
      # already-complete draft release, which is the point where GitHub
      # applies release immutability.
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PRERELEASE: ${{ inputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$PRERELEASE" == "true" ]]; then
            gh release edit "${RELEASE_TAG}" \
              --repo "$REPO" \
              --draft=false \
              --prerelease
          else
            gh release edit "${RELEASE_TAG}" \
              --repo "$REPO" \
              --draft=false
          fi
